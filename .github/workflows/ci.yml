name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest
      - run: node --check scripts/jev_ultrafast/static/app.js
      - run: node --check scripts/jev_ultrafast/snapshot.js
      - run: uv build
      - name: Skill folder imports on its own
        run: |
          d=$(mktemp -d)
          cp -r SKILL.md scripts references evals "$d"
          cd "$d"
          uv run --no-project --with-requirements scripts/requirements.txt python -c \
            "import sys; sys.path.insert(0, 'scripts'); import jev_helpers, jev_ultrafast.skill")
